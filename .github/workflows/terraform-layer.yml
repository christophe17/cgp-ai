# Workflow réutilisable : plan d'une couche, puis apply de l'artefact de plan relu.
# Le job d'apply déclare l'environnement GitHub : staging et prod exigent une approbation.
name: terraform-layer

on:
  workflow_call:
    inputs:
      env:
        description: Environnement cible (dev, staging, prod)
        required: true
        type: string
      layer:
        description: Couche (foundation, platform, agents, frontend)
        required: true
        type: string
      apply:
        description: Appliquer le plan après approbation de l'environnement
        required: false
        type: boolean
        default: false
    secrets:
      TF_PLAN_ARTIFACT_KEY:
        description: Clé symétrique qui chiffre l'artefact de plan (le dépôt est public)
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: eu-central-1

jobs:
  plan:
    name: plan ${{ inputs.env }}/${{ inputs.layer }}
    runs-on: ubuntu-24.04
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Identifiant du compte
        id: account
        run: |
          case "${{ inputs.env }}" in
            dev) echo "id=${{ vars.AWS_ACCOUNT_ID_DEV }}" >> "$GITHUB_OUTPUT" ;;
            staging) echo "id=${{ vars.AWS_ACCOUNT_ID_STAGING }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "id=${{ vars.AWS_ACCOUNT_ID_PROD }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "environnement inconnu"; exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.id }}:role/cgp-${{ inputs.env }}-github-plan
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        working-directory: infra/envs/${{ inputs.env }}/${{ inputs.layer }}
        run: terraform init -backend-config=backend.hcl
      - name: terraform plan
        id: plan
        working-directory: infra/envs/${{ inputs.env }}/${{ inputs.layer }}
        run: |
          set +e
          terraform plan -lock-timeout=60s -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt
          {
            echo "## Plan \`${{ inputs.env }}/${{ inputs.layer }}\` (code de sortie $code)"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Chiffrer l'artefact de plan
        if: inputs.apply && steps.plan.outputs.exitcode == '2'
        working-directory: infra/envs/${{ inputs.env }}/${{ inputs.layer }}
        env:
          KEY: ${{ secrets.TF_PLAN_ARTIFACT_KEY }}
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -in tfplan -out tfplan.enc -pass env:KEY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.apply && steps.plan.outputs.exitcode == '2'
        with:
          name: tfplan-${{ inputs.env }}-${{ inputs.layer }}-${{ github.run_id }}
          path: infra/envs/${{ inputs.env }}/${{ inputs.layer }}/tfplan.enc
          retention-days: 1
          if-no-files-found: error

  apply:
    name: apply ${{ inputs.env }}/${{ inputs.layer }}
    needs: plan
    if: inputs.apply && needs.plan.outputs.exitcode == '2'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Identifiant du compte
        id: account
        run: |
          case "${{ inputs.env }}" in
            dev) echo "id=${{ vars.AWS_ACCOUNT_ID_DEV }}" >> "$GITHUB_OUTPUT" ;;
            staging) echo "id=${{ vars.AWS_ACCOUNT_ID_STAGING }}" >> "$GITHUB_OUTPUT" ;;
            prod) echo "id=${{ vars.AWS_ACCOUNT_ID_PROD }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "environnement inconnu"; exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.id }}:role/cgp-${{ inputs.env }}-github-apply
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ inputs.env }}-${{ inputs.layer }}-${{ github.run_id }}
          path: infra/envs/${{ inputs.env }}/${{ inputs.layer }}
      - name: Déchiffrer l'artefact de plan
        working-directory: infra/envs/${{ inputs.env }}/${{ inputs.layer }}
        env:
          KEY: ${{ secrets.TF_PLAN_ARTIFACT_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in tfplan.enc -out tfplan -pass env:KEY
      - name: terraform init
        working-directory: infra/envs/${{ inputs.env }}/${{ inputs.layer }}
        run: terraform init -backend-config=backend.hcl
      - name: terraform apply (artefact relu)
        working-directory: infra/envs/${{ inputs.env }}/${{ inputs.layer }}
        run: terraform apply -lock-timeout=60s tfplan
