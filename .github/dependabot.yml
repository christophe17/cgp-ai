# Mises à jour de dépendances : Python (uv), actions GitHub (épinglées par SHA), providers Terraform.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /infra/global/organization
      - /infra/global/accounts/dev
      - /infra/envs/dev/foundation
    schedule:
      interval: weekly
