[project]
name = "cgp-agent-runtime"
version = "0.1.0"
description = "Conteneur AgentCore Runtime : point d'entrée, pipeline en code, streaming."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cgp-agents",
  "cgp-domain",
  "cgp-compliance",
  "cgp-verification",
]

[build-system]
requires = ["uv_build>=0.8.8,<0.13"]
build-backend = "uv_build"
