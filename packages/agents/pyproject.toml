[project]
name = "cgp-agents"
version = "0.1.0"
description = "Agents Strands, prompts versionnés, adaptateurs d'outils, configuration des modèles."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cgp-domain",
  "cgp-calc-engine",
  "cgp-params",
  "cgp-compliance",
  "cgp-verification",
  "cgp-legal-rag",
]

[build-system]
requires = ["uv_build>=0.8.8,<0.9"]
build-backend = "uv_build"
